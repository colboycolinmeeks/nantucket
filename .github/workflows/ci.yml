name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit IDs (with the version in a comment) and tools
# to fixed versions, so a moved tag can't change what runs here. Dependabot
# (.github/dependabot.yml) proposes updates.

jobs:
  # The full check on Linux, where Nantucket is developed: formatting, vet,
  # all Go tests, the .prg tests, and a scan of the dependencies for known
  # vulnerabilities.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check, test and build
        run: make all
      - name: Race detector
        run: go test -race ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Builds for the other systems that "make dist-all" packages.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and vet for each system
        run: |
          for p in windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64 linux/arm64; do
            echo "== $p"
            GOOS=${p%/*} GOARCH=${p#*/} go vet ./...
            GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null ./cmd/nantucket
          done

  # Windows and macOS are not yet supported, so failures here are reported
  # but don't fail the build. They show what needs work on those systems.
  other-systems:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
